<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>My First DevOps Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f0f8ff;
            color: #2c3e50;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #2980b9; }
        .info { font-size: 1.2rem; margin: 10px 0; }
        .status { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ยินดีต้อนรับสู่โลกของ DevOps 🚀</h1>
        <p class="info"><strong>ชื่อ-นามสกุล:</strong> วราวุธ เพ็งขุนทด</p>
        <p class="info"><strong>แผนก/สาขาวิชา:</strong> เทคโนโลยีสารสนเทศ</p>
        <hr>
        <p class="status">✅ โปรเจกต์นี้กำลังรันด้วยระบบ CI/CD อัตโนมัติ (Vercel)</p>
    </div>
</body>
</html>
